name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'Paw-M-Frontend/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Paw-M-Frontend/**'

env:
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  API_BASE_URL: http://localhost:3001/api
  CI: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Paw-M-Frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./Paw-M-Frontend
        run: npm ci
      
      - name: Install backend dependencies
        working-directory: ./Paw-M-Backend
        run: npm ci
      
      - name: Build frontend
        working-directory: ./Paw-M-Frontend
        run: npm run build
      
      - name: Install Playwright browsers
        working-directory: ./Paw-M-Frontend
        run: npx playwright install --with-deps chromium
      
      - name: Start backend server
        working-directory: ./Paw-M-Backend
        run: |
          npm run dev &
          sleep 15
          # Wait for backend to be ready
          for i in {1..30}; do
            if curl -f http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done
        env:
          NODE_ENV: development
          PORT: 3001
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: http://localhost:3000
      
      - name: Run Playwright tests
        working-directory: ./Paw-M-Frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001/api
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Paw-M-Frontend/playwright-report/
          retention-days: 7
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            Paw-M-Frontend/test-results/
            Paw-M-Frontend/test-results.json
            Paw-M-Frontend/test-results.xml
          retention-days: 7
      
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: Paw-M-Frontend/test-results/**/trace.zip
          retention-days: 7

  test-mobile:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Paw-M-Frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./Paw-M-Frontend
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: ./Paw-M-Frontend
        run: npx playwright install --with-deps chromium
      
      - name: Run mobile tests
        working-directory: ./Paw-M-Frontend
        run: npx playwright test --project=mobile-staff
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001/api
      
      - name: Upload mobile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mobile-results
          path: Paw-M-Frontend/test-results/
          retention-days: 7

  lint-and-typecheck:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Paw-M-Frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./Paw-M-Frontend
        run: npm ci
      
      - name: Run linting
        working-directory: ./Paw-M-Frontend
        run: npm run lint
      
      - name: Run type checking
        working-directory: ./Paw-M-Frontend
        run: npx tsc --noEmit