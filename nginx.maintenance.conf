# Maintenance mode ("clinic paused").
#
# The site is paused, so every page request is answered with the
# under-construction page instead of the real routes. The response is a
# 503 + Retry-After, which is what search engines expect from a temporary
# outage: they keep the clinic's pages in the index and show them as
# "temporarily unavailable" instead of dropping the rankings or replacing
# the pages with the maintenance copy.
#
# The page itself lives in public/maintenance/ and is copied verbatim into
# the image at /usr/share/nginx/html/maintenance/.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Any page request -> 503 -> the under-construction page.
    error_page 503 /maintenance/index.html;

    # The under-construction page. Not content-hashed, so it gets a short
    # cache: edits to the page go live on the next deploy instead of after
    # a year.
    location = /maintenance/index.html {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        add_header Retry-After 3600 always;
    }

    # Its stylesheet. Deliberately kept out of /assets/ - that folder is
    # served with a 1 year immutable cache (it holds hashed build output),
    # and this file is not hashed.
    location = /maintenance/styles.css {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        add_header Retry-After 3600 always;
    }

    # Root-level files crawlers expect (robots.txt, sitemap.xml, favicons)
    # are still served normally, so the site's SEO setup keeps working
    # while the pages themselves are paused.
    location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt|favicon\.(ico|svg)|apple-touch-icon\.png|og-image\.png)$ {
        try_files $uri =503;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Everything else (all routes, the prerendered pages, the app's JS/CSS)
    # gets the under-construction page.
    location / {
        return 503;
    }
}
