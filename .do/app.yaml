name: pawm-frontend
static_sites:
- name: frontend
  source_dir: /
  github:
    repo: YOUR_GITHUB_ORG/YOUR_FRONTEND_REPO
    branch: main
  # No dockerfile_path - uses Node.js buildpack
  build_command: npm ci && npm run build
  # TanStack Start with prerender outputs static assets to dist/client
  output_dir: dist/client
  environment_slug: node-js
  envs:
  - key: VITE_API_URL
    value: https://YOUR_BACKEND_APP.ondigitalocean.app
  - key: NODE_ENV
    value: production